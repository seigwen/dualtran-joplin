name: Publish to npm

# npm is removing 2FA-bypass tokens as a way to publish (direct publishing goes away in
# January 2027), so the release path is OIDC trusted publishing instead of a long-lived token.
#
# One-time setup on npmjs.com: package -> Settings -> Trusted publishing -> GitHub Actions,
# repository `seigwen/dualtran-joplin`, workflow `publish.yml`, environment omitted.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5; pin the major because npm 12 currently drops
      # esbuild's optional platform binary during `npm ci`, which breaks the plugin build.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm test

      - run: npm run release

      - name: Publish
        run: npm publish --provenance --access public
